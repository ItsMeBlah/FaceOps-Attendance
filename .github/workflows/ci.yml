name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-api-tests:
    name: Backend API endpoint tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      BACKEND_USE_TRITON: "false"
      BACKEND_WEIGHTS_DIR: weights
      QDRANT_URL: http://localhost:6333
      MONGODB_URI: mongodb://faceguard:faceguard@localhost:27017/?authSource=admin
      MONGODB_DATABASE: faceguard
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: faceguard
      MINIO_SECRET_KEY: faceguardsecret
      MINIO_SECURE: "false"
      MINIO_LOGS_BUCKET: logs
      MINIO_ALIGNED_IMAGES_BUCKET: aligned-images
      KAFKA_BOOTSTRAP_SERVERS: localhost:9094
      KAFKA_CLIENT_ID: faceguard-ci
      KAFKA_DEFAULT_GROUP_ID: faceguard-ci-workers

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip uninstall -y onnxruntime-gpu
          python -m pip install onnxruntime

      - name: Print backend runtime diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          import onnxruntime as ort

          print("ONNX Runtime providers:", ort.get_available_providers())
          weights_dir = Path("backend/weights")
          for model_name in (
              "face_detection.onnx",
              "emotion.onnx",
              "anti_spoofing.onnx",
              "resnet18_face.onnx",
          ):
              model_path = weights_dir / model_name
              print(f"{model_name}: exists={model_path.is_file()} size={model_path.stat().st_size if model_path.is_file() else 0}")
          PY

      - name: Validate backend Python syntax
        run: python -m compileall -q backend/app

      - name: Start backend dependency services
        run: |
          docker compose up -d qdrant mongodb minio kafka

          for container in facial-recognition-mongodb facial-recognition-minio facial-recognition-kafka; do
            echo "Waiting for ${container} to become healthy"
            for attempt in {1..90}; do
              status="$(docker inspect -f '{{.State.Health.Status}}' "${container}" 2>/dev/null || true)"
              if [ "${status}" = "healthy" ]; then
                echo "${container} is healthy"
                break
              fi
              if [ "${attempt}" = "90" ]; then
                docker logs "${container}" || true
                echo "${container} did not become healthy"
                exit 1
              fi
              sleep 2
            done
          done

          docker compose up kafka-init --exit-code-from kafka-init

      - name: Start FastAPI server
        working-directory: backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend-server.log 2>&1 &
          echo "$!" > ../backend-server.pid

          for attempt in {1..90}; do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then
              echo "FastAPI server is ready"
              exit 0
            fi
            if ! kill -0 "$(cat ../backend-server.pid)" 2>/dev/null; then
              echo "FastAPI server exited before becoming ready"
              cat ../backend-server.log
              exit 1
            fi
            sleep 2
          done

          echo "FastAPI server did not become ready"
          cat ../backend-server.log
          exit 1

      - name: Run API endpoint tests
        run: |
          headers_file="$(mktemp)"
          body_file="$(mktemp)"
          status="$(
            curl -sS \
              -D "${headers_file}" \
              -o "${body_file}" \
              -w "%{http_code}" \
              -F "file=@backend/API_endpoint_test/test_assets/unit_test_img.jpg;type=image/jpeg" \
              http://127.0.0.1:8000/api/detection/detect || true
          )"

          if [ "${status}" != "200" ]; then
            echo "Detection smoke test failed with HTTP ${status}"
            echo "Response headers:"
            cat "${headers_file}"
            echo "Response body:"
            cat "${body_file}"
            echo "Backend server log:"
            cat backend-server.log || true
            exit 1
          fi

          pytest backend/API_endpoint_test -v --base-url http://127.0.0.1:8000

      - name: Show backend logs on failure
        if: failure()
        run: |
          cat backend-server.log || true
          docker compose logs --no-color qdrant mongodb minio kafka kafka-init || true

      - name: Stop backend and dependencies
        if: always()
        run: |
          if [ -f backend-server.pid ]; then
            kill "$(cat backend-server.pid)" 2>/dev/null || true
          fi
          docker compose down -v --remove-orphans

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker build validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build application images
        run: |
          docker compose build backend frontend
