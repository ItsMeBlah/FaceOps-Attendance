inference:
  use_triton: false

triton:
  url: localhost:8000
  model_version: ""
  request_timeout: 5

models:
  weights_dir: weights

qdrant:
  url: http://localhost:6333
  api_key: ""
  collection: face_embeddings
  vector_size: 512
  top_k: 5
  max_registration_images: 5

mongodb:
  uri: mongodb://faceguard:faceguard@localhost:27017/?authSource=admin
  database: faceguard
  timeout_ms: 5000

minio:
  endpoint: localhost:9000
  access_key: faceguard
  secret_key: faceguardsecret
  secure: false
  region: us-east-1
  logs_bucket: logs
  aligned_images_bucket: aligned-images
  timeout_seconds: 1
